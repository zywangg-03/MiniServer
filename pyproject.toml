[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniserve"
version = "0.2.0"
description = "An incremental LLM inference serving systems project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["torch>=2.6,<3", "transformers==4.57.1", "fastapi==0.115.12", "uvicorn==0.34.3", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["miniserve*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["model: optional downloaded Qwen model acceptance tests"]

